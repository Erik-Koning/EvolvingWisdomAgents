[project]
name = "apg-core"
version = "0.1.0"
description = "Adaptive Prompt Graph (APG) kernel — Python runtime, conformance-locked to the TypeScript kernel"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apg_core"]
